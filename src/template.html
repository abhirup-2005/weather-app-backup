<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

</head>

<body>
    <video class="bg-video" autoplay muted loop playsinline></video>

    <main class="weather-app">
        <!-- SEARCH -->

        <section class="search-section">
            <form class="user-input-form">
                <input type="search" id="city" placeholder="Search city..." autocomplete="off">
                <button type="submit">
                    Search
                </button>
            </form>

        </section>

        <!-- CURRENT WEATHER -->
        <div class="weather-container hidden">
            <section class="current-weather">

                <div class="top-weather">

                    <div class="left-weather">

                        <div class="main-weather-info">

                            <img class="weather-icon" src="https://cdn-icons-png.flaticon.com/512/1779/1779940.png"
                                alt="Weather Icon">

                            <div>

                                <div class="temperature-row">

                                    <h1 class="temperature">
                                        37°
                                    </h1>

                                    <span class="unit">
                                        <button class="unit-btn c clicked">C</button> | <button class="unit-btn f">F</button>
                                    </span>

                                </div>

                                <p class="condition"></p>

                            </div>

                        </div>

                        <div class="extra-info">

                            <p>
                                AQI:
                                <span class="aqi"></span>
                            </p>

                            <p>
                                Humidity:
                                <span class="humidity"></span>
                            </p>

                            <p>
                                Wind:
                                <span class="wind-speed"></span>
                            </p>

                        </div>

                    </div>

                    <div class="right-weather">
                        <h2 class="city-name"></h2>
                        <p class="date-time"></p>
                    </div>

                </div>

            </section>

            <!-- AIR CONDITIONS -->

            <section class="details-section">

                <div class="detail-box">
                    <p class="detail-title">
                        Feels Like
                    </p>
                    <h3 class="feels-like"></h3>
                </div>

                <div class="detail-box">
                    <p class="detail-title">
                        UV Index
                    </p>
                    <h3 class="uv-index"></h3>
                </div>

                <div class="detail-box">
                    <p class="detail-title">
                        Visibility
                    </p>
                    <h3 class="visibility"></h3>
                </div>

                <div class="detail-box">
                    <p class="detail-title">
                        Pressure
                    </p>
                    <h3 class="pressure"></h3>
                </div>

            </section>

            <!-- HOURLY FORECAST -->

            <section class="forecast-section">

                <h3 class="section-title">
                    Hourly Forecast
                </h3>

                <div class="hourly-container">
                    <div class="hour-card">
                        <p></p>
                        <img>
                        <p></p>
                    </div>
                </div>

            </section>

            <!-- WEEKLY FORECAST -->

            <section class="forecast-section">

                <h3 class="section-title">
                    7-Day Forecast
                </h3>

                <div class="weekly-loading hidden"></div>

                <div class="weekly-container"></div>

            </section>

            <!-- SUNRISE / SUNSET -->

            <section class="sun-section">

                <div class="sun-box">
                    <p class="detail-title">
                        Sunrise
                    </p>
                    <h3 class="sunrise"></h3>
                </div>

                <div class="sun-box">
                    <p class="detail-title">
                        Sunset
                    </p>
                    <h3 class="sunset"></h3>
                </div>

            </section>
        </div>
        <!-- Loading template -->
        <div class="loader hidden">
            <div class="spinner"></div>
            <p>Loading weather...</p>
        </div>
    </main>
</body>

</html>
